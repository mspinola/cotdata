[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cotdata"
version = "0.5.0"
description = "Canonical CFTC positioning (COT) data layer — a producer/consumer split over a file-based store."
readme = "README.md"
authors = [
    {name = "Matt S.", email = "cotanalyzer@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
    "requests>=2.28",       # CFTC COT zips
    "python-dateutil>=2.8",
    "xlrd>=2.0",            # CFTC dea_fut_xls are legacy .xls
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mspinola/cotdata"
Repository = "https://github.com/mspinola/cotdata"
Issues = "https://github.com/mspinola/cotdata/issues"

[project.optional-dependencies]
# No vendor extras. `norgate`, `yahoo` and `databento` all moved to
# crucible-marketdata with the producers they installed for (ADR-0007), so this
# package has no optional data dependency at all: CFTC positioning is a plain HTTP
# download of public files.
dev = ["pytest>=7", "ruff==0.15.22"]

[project.scripts]
cotdata-update = "cotdata.update:main"
# An alias for cotdata-update, kept because scheduled jobs call it by name. There is
# no `cotdata-prices` any more: it ran the price half, and there is no price half.
cotdata-cot = "cotdata.update:main_cot"
cotdata-vintage = "cotdata.vintage_cli:main"
cotdata-schedule = "cotdata.vintage_cli:main_schedule"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cotdata = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
