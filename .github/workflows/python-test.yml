name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Run linting
      # scripts/ is included deliberately. The selected rules (E/F/W/I, E501 ignored) are
      # mostly not style: pyflakes F catches undefined names and unused imports, which are
      # crashes waiting to happen, and scripts/vintage_alert_selftest.py is a diagnostic
      # users are told to run -- a broken one is worse than none. Leaving a source root
      # unlinted also fails open: scripts/ had quietly accumulated 26 errors before anyone
      # looked. To revert, drop `scripts` here; nothing else depends on it.
      run: python -m ruff check src tests scripts
    - name: Run tests
      run: |
        # Create a dummy store for the test environment to prevent COTDATA_STORE missing errors
        mkdir -p /tmp/cotdata_store
        export COTDATA_STORE=/tmp/cotdata_store
        pytest tests/
