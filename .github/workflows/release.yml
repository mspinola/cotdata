name: Release

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC, no stored tokens).
# Same shape as the crucible workflow, deliberately: one publish mechanism across the
# fleet means one thing to get right and one thing to audit.
#
# Push a tag that matches the pyproject version, e.g.:
#     git tag v0.3.0 && git push origin v0.3.0
# A manual run (workflow_dispatch) builds and twine-checks WITHOUT publishing, which is
# the only dry run available: there is no TestPyPI path here.
#
# ONE-TIME SETUP, on PyPI rather than in this repo. The publish step authenticates by
# OIDC, so it fails until pypi.org/manage/project/cotdata/settings/publishing/ carries a
# GitHub publisher for owner `mspinola`, repo `cotdata`, workflow `release.yml`, and
# environment `pypi`. All four must match what is written below.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard — tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=v$TAG  pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match pyproject version $VER"; exit 1; }
      - name: Guard — __version__ must match pyproject version
        run: |
          PY="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/cotdata/__init__.py').read()).group(1))")"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "__init__=$PY  pyproject=$VER"
          test "$PY" = "$VER" || { echo "::error::__version__ $PY does not match pyproject version $VER"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    # tag push -> PyPI. A manual run stops after build, as a dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
